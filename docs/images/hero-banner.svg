<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="400" rx="12" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="55" text-anchor="middle" fill="#58a6ff" font-size="40" font-weight="700">agent-memory-hub</text>
  <text x="450" y="90" text-anchor="middle" fill="#8b949e" font-size="16">One Git repo as shared brain for all your AI Agents</text>

  <!-- Agent boxes -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="140" height="44" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="70" y="18" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">Claude Code</text>
    <text x="70" y="35" text-anchor="middle" fill="#8b949e" font-size="10">~/.claude/</text>

    <rect x="160" y="0" width="140" height="44" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="230" y="18" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">OpenCode</text>
    <text x="230" y="35" text-anchor="middle" fill="#8b949e" font-size="10">~/AGENTS.md</text>

    <rect x="320" y="0" width="140" height="44" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="390" y="18" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">Hermes</text>
    <text x="390" y="35" text-anchor="middle" fill="#8b949e" font-size="10">~/.hermes/</text>

    <rect x="480" y="0" width="140" height="44" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="550" y="18" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="600">QClaw</text>
    <text x="550" y="35" text-anchor="middle" fill="#6e7681" font-size="10">archive</text>

    <rect x="640" y="0" width="140" height="44" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="710" y="18" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="600">OpenClaw</text>
    <text x="710" y="35" text-anchor="middle" fill="#6e7681" font-size="10">archive</text>

    <!-- Arrows down -->
    <line x1="70" y1="44" x2="400" y2="82" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="230" y1="44" x2="400" y2="82" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="390" y1="44" x2="400" y2="82" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="550" y1="44" x2="400" y2="82" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="710" y1="44" x2="400" y2="82" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>

    <!-- Hub box -->
    <rect x="280" y="78" width="240" height="50" rx="10" fill="#0d419d" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="400" y="100" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">~/.shared/</text>
    <text x="400" y="118" text-anchor="middle" fill="#c9d1d9" font-size="11">USER.md / memory/ / agents/</text>
  </g>

  <!-- Bottom: cross-device -->
  <g transform="translate(180, 290)">
    <rect x="0" y="0" width="180" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="17" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="600">Device A</text>
    <text x="90" y="34" text-anchor="middle" fill="#8b949e" font-size="10">git push</text>

    <text x="230" y="28" text-anchor="middle" fill="#3fb950" font-size="20">&lt;-&gt;</text>

    <rect x="260" y="0" width="180" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="350" y="17" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="600">Device B</text>
    <text x="350" y="34" text-anchor="middle" fill="#8b949e" font-size="10">git pull</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="375" text-anchor="middle" fill="#6e7681" font-size="13">git clone + setup.sh = brain restored in 10 seconds</text>
</svg>
