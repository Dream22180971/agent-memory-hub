<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="12" fill="url(#bg)"/>

  <!-- Brain icon -->
  <text x="450" y="80" text-anchor="middle" font-size="64">🧠</text>

  <!-- Title -->
  <text x="450" y="130" text-anchor="middle" fill="url(#glow)" font-size="36" font-weight="700">agent-memory-hub</text>

  <!-- Subtitle -->
  <text x="450" y="165" text-anchor="middle" fill="#8b949e" font-size="16">One Git repo as shared brain for all your AI Agents</text>

  <!-- Agent boxes -->
  <g transform="translate(100, 210)">
    <!-- Claude -->
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" filter="url(#shadow)"/>
    <text x="70" y="22" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">Claude Code</text>
    <text x="70" y="40" text-anchor="middle" fill="#8b949e" font-size="11">~/.claude/</text>

    <!-- OpenCode -->
    <rect x="160" y="0" width="140" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" filter="url(#shadow)"/>
    <text x="230" y="22" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">OpenCode</text>
    <text x="230" y="40" text-anchor="middle" fill="#8b949e" font-size="11">~/AGENTS.md</text>

    <!-- Hermes -->
    <rect x="320" y="0" width="140" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" filter="url(#shadow)"/>
    <text x="390" y="22" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">Hermes</text>
    <text x="390" y="40" text-anchor="middle" fill="#8b949e" font-size="11">~/.hermes/</text>

    <!-- QClaw -->
    <rect x="480" y="0" width="140" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" filter="url(#shadow)"/>
    <text x="550" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="600">QClaw</text>
    <text x="550" y="40" text-anchor="middle" fill="#6e7681" font-size="11">archive</text>

    <!-- OpenClaw -->
    <rect x="640" y="0" width="140" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" filter="url(#shadow)"/>
    <text x="710" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="600">OpenClaw</text>
    <text x="710" y="40" text-anchor="middle" fill="#6e7681" font-size="11">archive</text>

    <!-- Arrows down -->
    <line x1="70" y1="50" x2="400" y2="90" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="230" y1="50" x2="400" y2="90" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="390" y1="50" x2="400" y2="90" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="550" y1="50" x2="400" y2="90" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="710" y1="50" x2="400" y2="90" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>

    <!-- Hub box -->
    <rect x="280" y="85" width="240" height="55" rx="10" fill="#0d419d" stroke="#58a6ff" stroke-width="1.5" filter="url(#shadow)" opacity="0.9"/>
    <text x="400" y="108" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">🧠  ~/.shared/</text>
    <text x="400" y="126" text-anchor="middle" fill="#c9d1d9" font-size="11">USER.md · memory/ · agents/</text>
  </g>

  <!-- Bottom: git sync -->
  <g transform="translate(220, 340)">
    <rect x="0" y="0" width="180" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="16" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="600">💻 Device A</text>
    <text x="90" y="32" text-anchor="middle" fill="#8b949e" font-size="10">git push</text>

    <text x="230" y="25" text-anchor="middle" fill="#3fb950" font-size="20">⟷</text>

    <rect x="260" y="0" width="180" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="350" y="16" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="600">💻 Device B</text>
    <text x="350" y="32" text-anchor="middle" fill="#8b949e" font-size="10">git pull</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="405" text-anchor="middle" fill="#6e7681" font-size="12">git clone + setup.sh → brain restored in 10 seconds</text>
</svg>
